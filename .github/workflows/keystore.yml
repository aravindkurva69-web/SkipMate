name: Create Keystore
on: workflow_dispatch
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        env:
          PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -keystore skipmate.jks -alias skipmate \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=SkipMate, O=YourName, C=IN"
          base64 -w0 skipmate.jks > keystore.b64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            skipmate.jks
            keystore.b64.txt
          retention-days: 1
